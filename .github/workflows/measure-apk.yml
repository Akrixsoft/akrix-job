name: Measure APK
on:
  push:
    paths: ['measure/android/**', '.github/workflows/measure-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - id: ks
        uses: actions/cache/restore@v4
        with: { path: ~/ks, key: akrix-ks-v1 }
      - if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ks && openssl rand -hex 16 > ~/ks/pw
          keytool -genkeypair -keystore ~/ks/release.jks -alias akrix -keyalg RSA -keysize 2048 -validity 20000 \
            -storepass "$(cat ~/ks/pw)" -keypass "$(cat ~/ks/pw)" -dname "CN=Akrix Job, O=Akrix, C=GE"
      - if: steps.ks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: ~/ks, key: akrix-ks-v1 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        run: |
          mkdir -p measure/android/app/src/main/assets && cp measure/app/index.html measure/android/app/src/main/assets/zamer.html
          export AK_KS=$HOME/ks/release.jks AK_PW=$(cat ~/ks/pw)
          gradle -p measure/android assembleRelease --no-daemon
      - name: Publish APK to Pages
        run: |
          mkdir -p measure/apk && cp measure/android/app/build/outputs/apk/release/app-release.apk measure/apk/measure.apk
          echo "{\"version\":\"2.$GITHUB_RUN_NUMBER\",\"build\":$GITHUB_RUN_NUMBER}" > measure/apk/version.json
          git config user.name "akrix-build" && git config user.email "build@akrix.local"
          git add measure/apk/measure.apk measure/apk/version.json && git commit -m "Measure APK 2.$GITHUB_RUN_NUMBER [skip ci]" && git pull --rebase && git push
